spring.application.name=Back-end-1
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}
spring.application.admin.enabled=false

# -----------------------------------------------------------------
# 1. HIKARI CONNECTION POOL FIX (Prevents Database Timeout Crashes)
# -----------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=30000

# -----------------------------------------------------------------
# 2. JSON & UTF-8 ENCODING FIX (Prevents Unterminated String Errors)
# -----------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.jackson.deserialization.ACCEPT_SINGLE_VALUE_AS_ARRAY=true
spring.jackson.parser.allow-unquoted-control-chars=true
